services:

  # FastAPI Application 
  fastapi:
    image: minirag-fastapi
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - fastapi_data:/app/assets
      - ../src:/app           # live reload: code changes apply without rebuild
    networks:
      - backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/.env.app

  # Streamlit Frontend UI
  frontend:
    image: minirag-frontend
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: frontend
    ports:
      - "8501:8501"
    networks:
      - backend
    restart: always
    depends_on:
      - fastapi
    env_file:
      - ./env/.env.app
  # Celery Worker — Processing queue (chunking)
  celery-worker-processing:
    image: minirag-celery
    build:
      context: ..
      dockerfile: docker/celery/Dockerfile
    container_name: celery-worker-processing
    deploy:
      resources:
        limits:
          memory: 2G
    command: >
      celery -A celery_app.celery_config:celery_app worker
      --loglevel=info
      --queues=processing
      --concurrency=2
      --hostname=processing-worker@%h
      --max-tasks-per-child=50
    volumes:
      - fastapi_data:/app/assets
      - ../src:/app           # live reload
    networks:
      - backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/.env.app

  # Celery Worker — Indexing queue (embeddings + vector DB)
  celery-worker-indexing:
    image: minirag-celery
    pull_policy: never
    container_name: celery-worker-indexing
    deploy:
      resources:
        limits:
          memory: 4G
    command: >
      celery -A celery_app.celery_config:celery_app worker
      --loglevel=info
      --queues=indexing
      --concurrency=1
      --hostname=indexing-worker@%h
      --max-tasks-per-child=20
    volumes:
      - fastapi_data:/app/assets
      - ../src:/app           # live reload
    networks:
      - backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - ./env/.env.app

  # Celery Beat — Periodic task scheduler
  # NOTE: Disabled — beat_schedule is empty. Re-enable when periodic tasks are added.
  # celery-beat:
  #   image: minirag-celery
  #   pull_policy: never
  #   container_name: celery-beat
  #   command: >
  #     celery -A celery_app.celery_config:celery_app beat
  #     --loglevel=info
  #     --scheduler celery.beat:PersistentScheduler
  #   networks:
  #     - backend
  #   restart: always
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - ./env/.env.app


  # Flower — Celery monitoring UI
  flower:
    image: minirag-celery
    pull_policy: never
    container_name: flower
    command: >
      celery -A celery_app.celery_config:celery_app flower
      --port=5555
      --broker_api=http://${RABBITMQ_DEFAULT_USER:-minirag}:${RABBITMQ_DEFAULT_PASS:-minirag_rabbit_2222}@rabbitmq:15672/api/
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"
    networks:
      - backend
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/.env.app

  # Nginx Service
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
    networks:
      - backend
    restart: always

  # MongoDB
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    # No ports exposed — only reachable within the backend network
    volumes:
      - mongodb_data:/data/db
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Qdrant (VectorDB)
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: qdrant
    # No ports exposed — only reachable within the backend network
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # RabbitMQ (Message Broker)
  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    # No ports exposed — AMQP and management UI only reachable within backend network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    env_file:
      - ./env/.env.rabbitmq
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Redis (Results Backend & Cache)
  redis:
    image: redis:8.0.3-alpine
    container_name: redis
    # No ports exposed — only reachable within the backend network
    volumes:
      - redis_data:/data
    env_file:
      - ./env/.env.redis
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:-minirag_redis_2222} redis-cli ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-minirag_redis_2222}"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "volatile-lru"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:11.6.0-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    # No ports exposed — scraped by Prometheus internally
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Removed /:/rootfs:ro — mounts entire host root, unnecessary security risk
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/user)($$|/)'
      - '--no-collector.netstat'
      - '--no-collector.softnet'
      - '--no-collector.diskstats'
    networks:
      - backend
    restart: always

  # MongoDB Exporter for Mongo metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:0.50.0
    container_name: mongodb-exporter
    # No ports exposed — scraped by Prometheus internally
    environment:
      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
    env_file:
      - ./env/.env.app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: always


networks:
  backend:
    driver: bridge

volumes:
  fastapi_data:
  mongodb_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  grafana_data: