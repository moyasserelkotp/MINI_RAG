## rabbitmq.conf
## Minimal production-grade RabbitMQ configuration
## Mounted at /etc/rabbitmq/rabbitmq.conf inside the container

# ── Networking ───────────────────────────────────────────────────────────────
listeners.tcp.default = 5672

# ── Management UI ────────────────────────────────────────────────────────────
management.tcp.port = 15672

# ── Logging ──────────────────────────────────────────────────────────────────
log.console = true
log.console.level = warning

# ── Memory / Disk thresholds ─────────────────────────────────────────────────
# Pause publishers when free disk space drops below 500 MB
disk_free_limit.absolute = 500MB
# Pause publishers when memory usage exceeds 40% of available RAM
vm_memory_high_watermark.relative = 0.4

# ── Message persistence ──────────────────────────────────────────────────────
# Durable queues are created by Celery; no extra config needed here.

# ── Connection heartbeat ─────────────────────────────────────────────────────
heartbeat = 60

# ── Consumer cancel notification ─────────────────────────────────────────────
# Notifies consumers when their queue is deleted
consumer_timeout = 3600000
